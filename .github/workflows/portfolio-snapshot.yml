name: Portfolio snapshot (read-only)

# Scheduled runs only become active once this workflow is on the default branch.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: portfolio-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Generate read-only JSON snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/portfolio_status.py --format json > portfolio-snapshot.json
      - name: Render Markdown dashboard
        if: always()
        run: |
          if test -s portfolio-snapshot.json; then
            python3 scripts/render_portfolio_dashboard.py portfolio-snapshot.json > portfolio-dashboard.md
          fi
      - name: Restore previous history from Actions artifact
        id: restore_history
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if test -s portfolio-snapshot.json; then
            python3 scripts/restore_portfolio_history.py
          fi
      - name: Build current history entry
        if: ${{ always() && steps.restore_history.outcome == 'success' }}
        run: |
          if test -s portfolio-snapshot.json; then
            python3 scripts/portfolio_history.py portfolio-snapshot.json --history portfolio-history.json
          fi
      - name: Upload snapshot even when some GitHub queries fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-portfolio-snapshot
          path: |
            portfolio-snapshot.json
            portfolio-dashboard.md
            portfolio-history.json
          if-no-files-found: warn
          retention-days: 14
