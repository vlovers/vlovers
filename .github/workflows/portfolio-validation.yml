name: Portfolio report validation

# Read-only checks. Documentation-only updates must also receive a fresh run.

on:
  push:
    paths:
      - 'scripts/portfolio_status.py'
      - 'scripts/render_portfolio_dashboard.py'
      - 'scripts/compare_portfolio_snapshots.py'
      - 'tests/test_portfolio_status.py'
      - 'tests/test_render_portfolio_dashboard.py'
      - 'tests/test_compare_portfolio_snapshots.py'
      - 'docs/ENGINEERING_PORTFOLIO.md'
      - 'docs/ENGINEERING_ROLLOUT_AUDIT.md'
      - 'docs/BRANCH_RULESET_SETUP.md'
      - 'docs/ENGINEERING_WORK_QUEUE.md'
      - '.github/workflows/portfolio-validation.yml'
      - '.github/workflows/portfolio-snapshot.yml'
  pull_request:
    paths:
      - 'scripts/portfolio_status.py'
      - 'scripts/render_portfolio_dashboard.py'
      - 'scripts/compare_portfolio_snapshots.py'
      - 'tests/test_portfolio_status.py'
      - 'tests/test_render_portfolio_dashboard.py'
      - 'tests/test_compare_portfolio_snapshots.py'
      - 'docs/ENGINEERING_PORTFOLIO.md'
      - 'docs/ENGINEERING_ROLLOUT_AUDIT.md'
      - 'docs/BRANCH_RULESET_SETUP.md'
      - 'docs/ENGINEERING_WORK_QUEUE.md'
      - '.github/workflows/portfolio-validation.yml'
      - '.github/workflows/portfolio-snapshot.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python3 -m py_compile scripts/portfolio_status.py scripts/render_portfolio_dashboard.py scripts/compare_portfolio_snapshots.py tests/test_portfolio_status.py tests/test_render_portfolio_dashboard.py tests/test_compare_portfolio_snapshots.py
      - run: python3 -m unittest discover -s tests -v
